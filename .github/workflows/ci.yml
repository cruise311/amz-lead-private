# .github/workflows/ci.yml
# CI pipeline for amz-lead-lookup-private

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install ruff==0.6.0

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install mypy==1.11.2

      - name: Run mypy
        run: mypy --strict --show-error-codes --pretty src/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-0 libsm6 libxext6 libxrender-dev libgl1-mesa-glx \
            libgomp1

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Install Playwright
        run: playwright install chromium

      - name: Run tests with coverage
        run: |
          pytest --cov=src/amz_lead_lookup_private \
                 --cov-report=xml \
                 --cov-report=term-missing \
                 --cov-fail-under=70 \
                 -x -q

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  # RapidOCR 专项测试（Linux 环境验证 OCR 引擎可用性）
  ocr-test:
    name: RapidOCR Engine Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies for OpenCV
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-0 libsm6 libxext6 libxrender-dev libgl1-mesa-glx \
            libgomp1 libglib2.0-0

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Test RapidOCR import and basic inference
        run: |
          python -c "
          from amz_lead_lookup_private import RapidOCREngine, extract_phones_from_image
          print('✅ RapidOCREngine imported successfully')
          
          engine = RapidOCREngine()
          print('✅ RapidOCREngine instantiated successfully')
          
          # Test with a simple synthetic image
          import numpy as np
          import cv2
          img = np.zeros((100, 300, 3), dtype=np.uint8)
          cv2.putText(img, '138 0000 1234', (10, 60), cv2.FONT_HERSHEY_SIMPLEX, 1, (255,255,255), 2)
          cv2.imwrite('/tmp/test_phone.png', img)
          
          phones = engine.extract_phones('/tmp/test_phone.png')
          print(f'✅ OCR test result: {phones}')
          assert '13800001234' in phones or '138 0000 1234' in phones, f'Phone not detected: {phones}'
          print('✅ RapidOCR engine test PASSED')
          "

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, ocr-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build --sdist --wheel .

      - name: Verify package
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # 发布到 GitHub Packages（仅 main 分支 tag 触发）
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install twine
          twine upload --repository-url https://pypi.pkg.github.com/cruise311 dist/*

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, ocr-test, build]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          JOBS=("lint" "typecheck" "test" "ocr-test" "build")
          FAILED=()
          for job in "\${JOBS[@]}"; do
            result="\${{ needs.\$job.result }}"
            if [[ "\$result" != "success" ]]; then
              FAILED+=("\$job")
            fi
          done
          if [[ \${#FAILED[@]} -gt 0 ]]; then
            echo "::error::Failed jobs: \${FAILED[*]}"
            exit 1
          fi
          echo "All CI jobs passed!"